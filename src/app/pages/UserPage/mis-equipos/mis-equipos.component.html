
<app-working-page [namePage]="'MyTeams'"></app-working-page>

<div *ngIf="false">
    <app-modal-loading  *ngIf="loading"></app-modal-loading>

    <div class="container-mis-equipos" *ngIf="!loading">
        <div class="header-me">
            <h1>MyTeams</h1>
        </div>

        <div class="no-teams" *ngIf="!existeEquipo">
            <h3>No tienes ningún equipo</h3>
            <button class="btn-primary" (click)="redirecToEquipos()">Busca tu equipo</button>
            <button class="btn-secondary" (click)="showListSolicitudes()">Ver mis solicitudes</button>
        </div>

        <div class="card-list" *ngIf="existeEquipo">
            <div class="card-equipo" *ngFor="let equipo of listEquipo" (click)="redirecToPerfilEquipo(equipo.equipo.id)">

                <div class="data-equipo">

                    <img src="../../../../assets/Logo team.jpg" alt="equipo" class="logo-equipo">

                    <div class="title-equipo">
                        <h3 class="name-equipo">{{equipo.equipo.nombre}}</h3>

                        <div class="detail-equipo">
                            <span><i class="fa-solid fa-users"></i>:&nbsp;&nbsp;{{equipo.countJugadores}}/15</span>
                            <span><i class="fa-solid fa-trophy"></i>:&nbsp;&nbsp;{{equipo.stats}}</span>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <app-modal-solicitudes
        *ngIf="showModalSolicitudes"
        [list]="listSolicitudes"
        (closed)="closeModal()"
    ></app-modal-solicitudes>
</div>
