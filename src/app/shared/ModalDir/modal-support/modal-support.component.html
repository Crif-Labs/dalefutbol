<div class="custom-modal-backdrop" @fadeBackdrop>
    <div class="custom-modal" @fadeModal>

        <div class="header-modal">
            <h5>Soporte</h5>
        </div>
        
        <div class="body-modal">
            <form class="form-support" [formGroup]="formSupport">
                <!-- <span class="list"><i class="fa-brands fa-whatsapp"></i> +56 9 49386899</span> -->

                <span>Ingresa tu duda, sugerencia o problema</span>
                <textarea name="" id="" formControlName="description"></textarea>

                <button class="btn-primary" (click)="sendDescription()">Enviar</button>
            </form>

        </div>

        <div class="footer-modal">
            <button class="btn-secondary" (click)="close()" >Cerrar</button>
        </div>
    </div>
</div>
